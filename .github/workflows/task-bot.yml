name: 共同作業ボット

# 作業タスク（検証・調査・実装・素材・資料）の Issue コメントコマンドを処理する。
# 協力者にリポジトリの権限を渡さなくても、コメントだけで担当・進捗・提出物が記録される。
# コマンドの一覧は .github/scripts/task-bot.js の先頭。
# ラベルを足したり変えたりしたら Actions タブ → 共同作業ボット → Run workflow で反映する。

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '17 21 * * *'   # 毎日 6:17（日本時間）に、3日間報告のない担当を未着手に戻す
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: task-bot-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  bot:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const bot = require('./.github/scripts/task-bot.js');
            await bot({ github, context, core });
